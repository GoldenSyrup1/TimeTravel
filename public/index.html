<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TimeTravel</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app">
    <h1>TimeTravel</h1>
    <p class="tagline">Tell it when to leave. It learns from you, not from Maps.</p>

    <section class="add-destination">
      <form id="add-destination-form">
        <input type="text" id="destination-name" placeholder="Add a destination (e.g. UNSW)" required>
        <button type="submit">Add</button>
      </form>
    </section>

    <section class="destinations">
      <ul id="destinations-list"></ul>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
